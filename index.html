<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Приют слёз</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Cormorant+SC:wght@600&family=Marck+Script&display=swap">
<style>
/* Layout: one stage. Painted scene fills it; a portrait stands at the left; speech sits in a strip along the bottom; maps, battles and papers open over the scene. */
:root{
  color-scheme:dark;
  --night:#0c0d10; --panel:#15161b; --edge:#3a3530;
  --bone:#e9e2d0; --ash:#9c968a;
  --candle:#d9a441; --wound:#b23a2e; --ghost:#a9d4e6; --chalk:#f4efe1;
  --body:"Cormorant Garamond",Georgia,serif; --caps:"Cormorant SC",Georgia,serif;
  --hand:"Caveat","Comic Sans MS",cursive; --whisper:"Marck Script","Caveat",cursive;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--bone);font-family:var(--body);font-size:20px;line-height:1.35;padding-inline:16px;box-sizing:border-box}
#game{position:relative;height:100%;max-width:1120px;margin-inline:auto;overflow:hidden;background:var(--night)}
#bg,#bg2{position:absolute;inset:-12px;background-size:cover;background-position:center;transition:opacity .9s}
#fx,#vig{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(5,5,8,.85) 100%)}
#game.hurt #vig{animation:hurt .45s}
@keyframes hurt{30%{background:radial-gradient(ellipse at 50% 40%,rgba(178,58,46,.25) 20%,rgba(120,10,10,.9) 100%)}}
#top{position:absolute;inset:0 0 auto 0;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:10px 14px;font-family:var(--caps);font-size:15px;letter-spacing:.06em;color:var(--ash);background:linear-gradient(rgba(5,5,8,.8),transparent);z-index:7}
#top b{color:var(--bone);font-weight:600}
#loc{color:var(--candle);margin-right:auto}
#top button{font-family:var(--caps);font-size:14px;letter-spacing:.06em;color:var(--bone);background:rgba(21,22,27,.7);border:1px solid var(--edge);padding:3px 10px;cursor:pointer}
#top button:hover,#top button:focus-visible{border-color:var(--candle);outline:none}
/* portrait */
#port{position:absolute;left:2%;bottom:150px;height:min(46%,380px);aspect-ratio:1;object-fit:contain;transition:opacity .4s,transform .4s;filter:drop-shadow(0 8px 30px #000)}
#port.sq{-webkit-mask-image:radial-gradient(circle,#000 52%,transparent 71%);mask-image:radial-gradient(circle,#000 52%,transparent 71%)}
#port.ghost{opacity:.82;filter:drop-shadow(0 0 26px rgba(169,212,230,.55));animation:float 4s ease-in-out infinite}
#port.dim{opacity:.35}
@keyframes float{50%{transform:translateY(-10px)}}
/* centre card: drawings, papers, found things */
#mid{position:absolute;inset:50px 0 160px 0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding-inline:12px}
.draw{background:#2a2b2c;border:10px solid #4a3b2c;box-shadow:0 14px 50px #000;padding:10px;max-width:min(430px,82%);transform:rotate(-1.5deg);animation:pop .5s}
.draw img,.draw svg{display:block;width:100%;height:auto;max-height:38vh;object-fit:contain}
.draw p{margin:8px 0 0;font-family:var(--hand);font-size:23px;line-height:1.1;color:var(--chalk);text-align:center}
.doc{background:#d8ccae;color:#2c2318;font-family:var(--hand);font-size:23px;line-height:1.2;padding:22px 26px;max-width:min(470px,86%);box-shadow:0 14px 50px #000;transform:rotate(1deg);animation:pop .5s;max-height:100%;overflow:auto;pointer-events:auto}
.doc h4{margin:0 0 8px;font-family:var(--caps);font-size:17px;letter-spacing:.1em;border-bottom:1px solid #2c231866;padding-bottom:4px}
.doc p{margin:0 0 9px}
.item{text-align:center;animation:pop .5s;max-width:min(380px,82%)}
.item img{width:min(250px,34vh);height:min(250px,34vh);object-fit:contain;filter:drop-shadow(0 0 34px rgba(217,164,65,.5))}
.item img.sq{border-radius:50%;object-fit:cover}
.item h4{margin:6px 0 2px;font-family:var(--caps);font-size:21px;color:var(--candle);letter-spacing:.06em}
.item p{margin:0;font-style:italic;text-shadow:0 2px 8px #000}
@keyframes pop{from{opacity:0;transform:scale(.9) rotate(0)}}
#whisper{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8%;font-family:var(--whisper);font-size:clamp(30px,6vw,54px);line-height:1.15;color:var(--wound);text-shadow:0 0 30px #000,0 0 12px rgba(178,58,46,.6);background:rgba(5,5,8,.6);animation:creep 1.6s both;cursor:pointer;z-index:4}
@keyframes creep{from{opacity:0;letter-spacing:.3em;filter:blur(8px)}}
/* speech strip */
#box{position:absolute;inset:auto 0 0 0;min-height:132px;max-height:62%;overflow:auto;box-sizing:border-box;padding:18px 22px 20px;background:linear-gradient(transparent,rgba(8,8,11,.93) 26px);cursor:pointer;z-index:3}
#box .inner{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
#name{align-self:flex-start;font-family:var(--caps);font-size:18px;letter-spacing:.08em;padding:1px 12px;border-bottom:2px solid currentColor;margin-top:14px}
#text{margin:14px 0 0;min-height:2.6em;text-shadow:0 2px 6px #000}
#name+#text{margin-top:0}
#box.n #text{font-style:italic;text-align:center;color:var(--bone)}
#box.t #text{color:var(--ash);font-style:italic;border-left:2px solid var(--ash);padding-left:14px}
#box.t #name{color:var(--ash);border:0;padding-left:0;font-size:14px}
#box.g #text{color:var(--ghost);letter-spacing:.04em;text-shadow:0 0 14px rgba(169,212,230,.7);animation:flick 3s infinite}
#box.a #text{font-family:var(--hand);font-size:26px;color:var(--chalk);line-height:1.1}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}50%{opacity:.55}53%{opacity:1}}
#more{align-self:flex-end;font-family:var(--caps);font-size:12px;letter-spacing:.14em;color:var(--ash);animation:flick 1.6s infinite}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.opts button,.btn{font-family:var(--body);font-size:20px;line-height:1.2;text-align:left;color:var(--bone);background:rgba(21,22,27,.85);border:1px solid var(--edge);border-left:3px solid var(--candle);padding:9px 14px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
.opts button:hover,.opts button:focus-visible,.btn:hover,.btn:focus-visible{background:#22232b;border-color:var(--candle);outline:none}
.opts button.fight{border-left-color:var(--wound)}
.opts .k{font-family:var(--caps);font-size:14px;color:var(--candle)}
.opts .tag{margin-left:auto;font-family:var(--caps);font-size:13px;letter-spacing:.06em;color:var(--ash);white-space:nowrap}
#toast{position:absolute;top:56px;right:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:9;pointer-events:none}
#toast div{font-family:var(--caps);font-size:15px;letter-spacing:.05em;background:rgba(12,13,16,.92);border:1px solid var(--edge);border-right:3px solid var(--candle);padding:5px 12px;animation:toast 4.2s both}
#toast div.bad{border-right-color:var(--wound)}#toast div.gh{border-right-color:var(--ghost)}
@keyframes toast{0%{opacity:0;transform:translateX(20px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
/* overlays */
#ov{position:absolute;inset:0;overflow:auto;background:rgba(8,8,11,.86);z-index:6;display:flex;flex-direction:column;padding:54px 16px 18px;box-sizing:border-box}
#ov.clear{background:rgba(8,8,11,.55)}
#ov h1{font-family:var(--caps);font-weight:600;font-size:clamp(40px,8vw,72px);margin:0;letter-spacing:.06em;line-height:1;text-wrap:balance;text-shadow:0 4px 30px #000}
#ov h2{font-family:var(--caps);font-weight:600;font-size:26px;margin:0;letter-spacing:.06em;color:var(--candle)}
.col{max-width:640px;width:100%;margin:auto;display:flex;flex-direction:column;gap:14px}
.col p{margin:0;text-shadow:0 2px 8px #000}
.small{font-size:16px;color:var(--ash)}
/* map */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-family:var(--caps);font-size:15px;letter-spacing:.06em;color:var(--ash);background:none;border:1px solid var(--edge);padding:4px 14px;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--night);background:var(--candle);border-color:var(--candle)}
.plan{display:grid;gap:5px;background:#1b1612;border:6px solid #2b231c;padding:5px;min-height:240px}
.plan button{font-family:var(--caps);font-size:clamp(13px,2.4vw,17px);letter-spacing:.04em;line-height:1.1;color:var(--bone);background:#3a2e24;border:1px solid #5a4838;cursor:pointer;padding:8px 4px;min-height:92px;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.plan button:hover:not(:disabled),.plan button:focus-visible{border-color:var(--candle);background:#4a3a2c;outline:none}
.plan button.seen{background:#241d18;color:var(--ash)}
.plan button:disabled{background:repeating-linear-gradient(45deg,#17130f,#17130f 6px,#1f1914 6px,#1f1914 12px);color:#6a6156;cursor:not-allowed}
.plan .stair{background:none;border:1px dashed #5a4838;color:var(--ash);font-family:var(--caps);font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center}
.plan small{font-family:var(--body);font-size:13px;color:var(--ash);letter-spacing:0}
/* journal */
.sheet{background:var(--panel);border:1px solid var(--edge);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:6px 0 0;font-family:var(--caps);font-size:16px;letter-spacing:.1em;color:var(--candle);font-weight:600}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:18px}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.pips i{width:11px;height:11px;border:1px solid var(--edge);transform:rotate(45deg)}
.pips i.on{background:var(--candle);border-color:var(--candle)}.pips i.off{background:var(--wound);border-color:var(--wound)}
/* dice */
.dice{margin:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;cursor:pointer}
.die{width:118px;height:118px;display:flex;align-items:center;justify-content:center;font-family:var(--caps);font-size:54px;color:var(--night);background:var(--bone);clip-path:polygon(50% 0,96% 26%,96% 74%,50% 100%,4% 74%,4% 26%)}
.die.roll{animation:spin .7s linear}
.die.ok{background:var(--candle)}.die.no{background:var(--wound);color:var(--bone)}
@keyframes spin{to{transform:rotate(720deg)}}
/* battle */
.arena{flex:1;display:flex;flex-direction:column;gap:10px;max-width:860px;width:100%;margin-inline:auto;min-height:0}
.foe{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;position:relative}
.foe img{flex:1;min-height:0;max-height:300px;aspect-ratio:1;object-fit:contain;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(0,0,0,.9))}
.foe img.sq{-webkit-mask-image:radial-gradient(circle,#000 52%,transparent 71%);mask-image:radial-gradient(circle,#000 52%,transparent 71%)}
.foe.hit img{animation:hit .35s}
@keyframes hit{20%{transform:translateX(-14px) scale(.96);filter:brightness(3)}60%{transform:translateX(10px)}}
.dmg{position:absolute;top:30%;left:50%;font-family:var(--caps);font-size:46px;color:var(--bone);text-shadow:0 0 12px var(--wound),0 2px 4px #000;animation:rise .9s both;pointer-events:none}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.intent{font-family:var(--caps);font-size:16px;letter-spacing:.04em;color:var(--night);background:var(--candle);padding:2px 14px;text-align:center}
.hpbar{width:min(320px,90%);height:12px;background:#000;border:1px solid var(--edge);position:relative}
.hpbar i{display:block;height:100%;background:var(--wound);transition:width .4s}
.stat{font-family:var(--caps);font-size:15px;letter-spacing:.04em;color:var(--ash);text-align:center;font-variant-numeric:tabular-nums}
.stat b{color:var(--bone)}.stat .sh{color:#9db4c9}
.me{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.orbs{display:flex;gap:5px}
.orbs i{width:16px;height:16px;border-radius:50%;border:1px solid var(--candle)}.orbs i.on{background:var(--candle);box-shadow:0 0 10px var(--candle)}
.msg{text-align:center;font-style:italic;font-size:18px;min-height:1.4em;color:var(--bone)}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cardb{width:118px;min-height:150px;box-sizing:border-box;padding:0 0 8px;background:linear-gradient(#26262e,#16161b);border:1px solid #5a5560;border-radius:6px;color:var(--bone);cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:center;font-family:var(--body);position:relative;transition:transform .15s,box-shadow .15s;animation:deal .3s both}
@keyframes deal{from{opacity:0;transform:translateY(30px)}}
.cardb:hover:not(:disabled),.cardb:focus-visible{transform:translateY(-10px);box-shadow:0 10px 24px #000,0 0 0 1px var(--candle);outline:none}
.cardb:disabled{opacity:.4;cursor:not-allowed}
.cardb .band{height:30px;border-radius:5px 5px 0 0;display:flex;align-items:center;justify-content:center;font-size:19px}
.cardb.a .band{background:linear-gradient(#8f2d24,#5e1c17)}.cardb.d .band{background:linear-gradient(#4b6076,#2c3a49)}.cardb.s .band{background:linear-gradient(#6a4d86,#3f2c52)}.cardb.j .band{background:#333}
.cardb .cost{position:absolute;top:-7px;left:-7px;width:26px;height:26px;border-radius:50%;background:var(--candle);color:var(--night);font-family:var(--caps);font-size:17px;line-height:26px}
.cardb b{font-family:var(--caps);font-size:16px;line-height:1.05;padding:0 6px;font-weight:600}
.cardb span.d{font-size:15.5px;line-height:1.12;padding:0 7px;color:#cfc8b6}
.cardb kbd{font-family:var(--caps);font-size:11px;color:var(--ash);margin-top:auto}
.brow{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{border-left-width:1px;font-family:var(--caps);font-size:17px;letter-spacing:.06em}
@media(max-width:620px){body{font-size:18px}#port{height:170px;bottom:170px}.cardb{width:102px;min-height:140px}.opts button{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
.eyebrow{font-family:var(--caps);font-size:14px;letter-spacing:.16em;color:var(--candle);text-transform:lowercase}
#menu{position:absolute;inset:0;z-index:20;background:rgba(6,6,9,.93);overflow:auto;display:flex;padding:30px 16px;box-sizing:border-box}
#menu h2,#ov h2{font-family:var(--caps);font-weight:600;font-size:26px;margin:0;letter-spacing:.06em;color:var(--candle)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist button,.btn2{font-family:var(--caps);font-size:19px;letter-spacing:.06em;text-align:left;color:var(--bone);background:var(--panel);border:1px solid var(--edge);padding:10px 16px;cursor:pointer;display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.mlist button:hover:not(:disabled),.mlist button:focus-visible,.btn2:hover:not(:disabled),.btn2:focus-visible{border-color:var(--candle);outline:none}
.mlist button:disabled,.btn2:disabled{opacity:.45;cursor:not-allowed}
.mlist small{font-family:var(--body);font-size:15px;color:var(--ash);letter-spacing:0;text-align:right}
.vol{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-family:var(--caps);font-size:16px;color:var(--ash)}
.vol input{width:100%;accent-color:var(--candle)}
/* dice window */
.dice{max-width:520px}
.dice .ask{margin:0;font-style:italic;font-size:22px;text-shadow:0 2px 8px #000}
.dice .calc{font-family:var(--caps);font-size:16px;letter-spacing:.04em;color:var(--ash)}
.dice .calc b{color:var(--bone)}
button.die{border:0;cursor:pointer;font-size:38px;transition:transform .15s,filter .15s}
button.die:hover:not(:disabled),button.die:focus-visible{transform:scale(1.08);filter:drop-shadow(0 0 16px var(--candle));outline:none}
button.die:disabled{cursor:default}
/* character creation */
#cr{max-width:820px}
#cr .steps{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--caps);font-size:14px;letter-spacing:.06em;color:var(--ash)}
#cr .steps span{padding:2px 10px;border:1px solid var(--edge)}#cr .steps span.on{background:var(--candle);color:var(--night);border-color:var(--candle)}
#cr input[type=text]{font-family:var(--body);font-size:22px;color:var(--bone);background:var(--panel);border:1px solid var(--edge);padding:8px 12px;width:100%;box-sizing:border-box}
#cr input[type=text]:focus{outline:none;border-color:var(--candle)}
#cr label{font-family:var(--caps);font-size:15px;letter-spacing:.08em;color:var(--candle)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.chip{font-family:var(--caps);font-size:16px;letter-spacing:.03em;color:var(--bone);background:var(--panel);border:1px solid var(--edge);padding:7px 8px;cursor:pointer;text-align:center;line-height:1.1}
.chip:hover:not(:disabled),.chip:focus-visible{border-color:var(--candle);outline:none}
.chip[aria-pressed=true]{background:var(--candle);color:var(--night);border-color:var(--candle)}
.chip:disabled{opacity:.4;cursor:not-allowed}.chip.fix{border-style:dashed;color:var(--ash)}
.info{background:rgba(21,22,27,.85);border:1px solid var(--edge);border-left:3px solid var(--candle);padding:12px 16px;font-size:18px;display:flex;flex-direction:column;gap:5px}
.info b{font-family:var(--caps);letter-spacing:.04em}
.abt{display:grid;grid-template-columns:minmax(0,1.5fr) auto auto auto auto minmax(0,.8fr) auto;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.abt .h{font-family:var(--caps);font-size:12px;letter-spacing:.08em;color:var(--ash)}
.abt b{font-family:var(--caps);font-size:19px}.abt .sc{font-family:var(--caps);font-size:24px;color:var(--candle);text-align:center;min-width:1.6em}
.abt button{width:34px;height:34px;font-size:20px;color:var(--bone);background:var(--panel);border:1px solid var(--edge);cursor:pointer}
.abt button:hover:not(:disabled){border-color:var(--candle)}.abt button:disabled{opacity:.3;cursor:not-allowed}
.abt button[aria-pressed=true]{background:var(--candle);color:var(--night)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
@media(max-width:620px){.abt{grid-template-columns:minmax(0,1fr) auto auto auto auto auto}.abt .cst{display:none}}
#menu textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.3;color:var(--bone);background:var(--panel);border:1px solid var(--edge);padding:8px 10px;width:100%;box-sizing:border-box;height:96px;resize:vertical;word-break:break-all}
#menu textarea:focus{outline:none;border-color:var(--candle)}
.arena{position:relative}.me{position:relative}
.cardb.use-a{animation:usea .26s forwards}.cardb.use-d{animation:used .26s forwards}.cardb.use-s,.cardb.use-j{animation:uses .26s forwards}
@keyframes usea{to{transform:translateY(-170px) rotate(-10deg) scale(1.15);opacity:0}}
@keyframes used{to{transform:translateY(-36px) scale(1.25);opacity:0;filter:brightness(2.2)}}
@keyframes uses{to{transform:translateY(-90px) rotate(18deg) scale(.6);opacity:0;filter:brightness(2.6)}}
.foe.atk img{animation:lunge .5s}@keyframes lunge{35%{transform:translateY(70px) scale(1.3);filter:brightness(1.5) drop-shadow(0 0 30px var(--wound))}}
.foe.cast img{animation:cast .65s}@keyframes cast{50%{transform:scale(1.07);filter:brightness(2) drop-shadow(0 0 34px var(--wound))}}
.foe.hit::after{content:"";position:absolute;top:34%;left:50%;width:min(240px,60%);height:5px;margin-left:calc(min(240px,60%)/-2);background:#fff;box-shadow:0 0 16px #fff;transform:rotate(-32deg);animation:slash .32s forwards;pointer-events:none}
@keyframes slash{from{clip-path:inset(0 100% 0 0)}55%{clip-path:inset(0 0 0 0);opacity:1}to{clip-path:inset(0 0 0 0);opacity:0}}
.banner{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);font-family:var(--caps);font-size:clamp(24px,5vw,42px);letter-spacing:.1em;color:var(--bone);text-shadow:0 0 18px #000,0 0 6px #000,0 0 34px var(--wound);pointer-events:none;animation:ban .45s;z-index:2;text-align:center;width:100%}
.banner.you{text-shadow:0 0 18px #000,0 0 6px #000,0 0 34px var(--candle)}

  const P={
   punish:`<rect x="30" y="30" width="70" height="110" fill="none" stroke="#f4efe1"/><path d="M65 30v110" stroke="#f4efe1"/><circle cx="52" cy="72" r="7" fill="none" stroke="#f4efe1"/><path d="M48 76q4 -4 8 0M49 70h1M54 70h1" stroke="#f4efe1" fill="none"/>${fig(160,70)}<path d="M135 40v100M135 140h60" stroke="#f4efe1"/>${fig(250,50)}<path d="M263 70q30 20 14 60" stroke="#b23a2e" stroke-width="5" fill="none"/>`,
   coven:`<circle cx="160" cy="100" r="22" fill="#b23a2e" stroke="#f4efe1"/>${fig(70,60,'#f4efe1','#222')}${fig(250,60,'#f4efe1','#222')}${fig(160,14,'#f4efe1','#222')}<path d="M152 8l16 12M168 8l-16 12M154 14h12" stroke="#b23a2e"/><path d="M95 80q20 -30 50 -40M225 80q-20 -30 -50 -40" stroke="#f4efe1" fill="none" stroke-dasharray="4 5"/>`,
   summon:`<circle cx="160" cy="95" r="70" fill="none" stroke="#b23a2e" stroke-width="5"/><path d="M160 60l-22 60h44zM148 62q-18 -14 -10 -32M172 62q18 -14 10 -32M175 118q40 14 34 -26l8 6" stroke="#f4efe1" fill="none"/><circle cx="153" cy="84" r="2.5" fill="#b23a2e"/><circle cx="167" cy="84" r="2.5" fill="#b23a2e"/>`,
   puppet:`${fig(90,70,'#f4efe1','#3f77b5')}<path d="M80 60l-8 -10M100 60l8 -10M84 56l-6 -12M96 56l6 -12" stroke="#f4efe1"/>${fig(220,70)}<path d="M207 90V4M233 90V4M210 123V4M230 123V4" stroke="#f4efe1" stroke-dasharray="3 4"/><path d="M215 69h4M222 69h4" stroke="#f4efe1"/><path d="M240 40l6 -6l-2 8l8 -2l-6 6" stroke="#f4efe1" fill="none"/>`,
   heart:`<path d="M160 150C90 100 100 50 135 50c15 0 25 12 25 22c0 -10 10 -22 25 -22c35 0 45 50 -25 100z" fill="#777" stroke="#f4efe1"/><path d="M160 50V10" stroke="#f4efe1" stroke-dasharray="3 4"/><path d="M110 40l100 120M210 40l-100 120" stroke="#b23a2e" stroke-width="6"/>`};
  return `<svg viewBox="0 0 320 170" stroke-width="3" stroke-linecap="round"><defs><filter id="ch"><feTurbulence baseFrequency=".9" numOctaves="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3"/></filter></defs><g filter="url(#ch)">${P[k]}</g></svg>`;
}

const GHOSTROOM={wc:'dorothy',men:'demid',director:'olivia',library:'john'};
function enter(id){
  const r=ROOMS[id];$('#ov').hidden=true;atHub=false;
  if(!r)return run(SC[id]());
  setBg(r.bg);$('#loc').textContent=r.n;sfx('door');mood({theater:'theater',babies:'babies',library:'calm',kitchen:'calm',special:'red',mother:'red',altar:'altar',girls:F('girls')?'girls':'house'}[id]||(r.fl==0?'cellar':'house'));
  const first=!S.seen[id];let pre=[];
  if(first){S.seen[id]=1;S.count++;
    if(S.count==2&&!F('babies'))pre=[['sfx','cry'],['n','Где-то наверху заплакал младенец. Плач оборвался так резко, будто закрыли дверь.']];
    if(S.count==4)pre=[['mood','dread'],['n','Из стены за вашим плечом вытянулась белая рука и прошла сквозь грудь. Холод.'],['fight','ghost',[['n','Белое втянулось обратно в стену. Дом снова тих.']]]];
    if(S.count==6)pre=[['mood','dread'],['w','Уходи, пока я добрая.']];
  }
  run(pre.concat(first||id=='altar'||S.g[GHOSTROOM[id]]!==undefined?r.s():[['n','Вы уже были здесь. Ничего не изменилось. Кажется.']]));
}
function goal(){return !F('babies')?'Найти пропавших младенцев':!F('girls')?'Понять, кто хозяин этого дома':!F('bulezau')?'Подвал: тварь за шкафами':'Выбраться отсюда с детьми'}
function hub(){
  $('#box').hidden=true;portrait(null);$('#mid').innerHTML='';hud();
  if(!F('girls')&&(S.count>=7||F('bulezau')))return run(SC.meet());
  if(F('girls')&&F('bulezau')&&!F('inv'))return run(SC.invite());
  atHub=true;autosave();mood('house');
  setBg('hub');$('#loc').textContent='План дома';
  const ov=$('#ov'),fl=FLOORS[S.floor];ov.hidden=false;ov.className='clear';
  const tiles=fl.areas.match(/[a-z0-9]+/g).filter((v,i,a)=>a.indexOf(v)==i).map(id=>{
    if(id=='st')return `<div class="stair" style="grid-area:st">лест&shy;ница</div>`;
    const r=ROOMS[id],lock=r.lock&&r.lock();
    return `<button style="grid-area:${id}" data-r="${id}" class="${S.seen[id]?'seen':''}" ${lock?'disabled':''}>${lock?'???':r.n}<small>${lock?'стена':S.seen[id]?'осмотрено':id=='bedroom'&&!F('bedroom')?'заперто':''}</small></button>`}).join('');
  ov.innerHTML=`<div class="col" style="max-width:820px"><h2>${fl.n}</h2><p class="small">Цель: ${goal()}. Осмотрено комнат: ${S.count}. Игра сохранена.</p>
   <div class="tabs">${[1,2,3,0].map(f=>`<button data-f="${f}" aria-pressed="${f==S.floor}">${FLOORS[f].n}</button>`).join('')}</div>
   <div class="plan" style="grid-template-areas:${fl.areas};grid-template-columns:${fl.cols}">${tiles}</div></div>`;
  ov.onclick=e=>{const b=e.target.closest('button');if(!b)return;sfx('click');if(b.dataset.f!=null){S.floor=+b.dataset.f;hub()}else if(b.dataset.r){ov.onclick=null;enter(b.dataset.r)}};

  if(B.weakP)d=Math.floor(d*.75);if(e.vuln)d=Math.floor(d*1.5);d=Math.max(0,d);

let SPD=calm?.35:1;const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPD));

async function play(i){

  P.push(n>=12?'Старосте вы рассказали всё: про каргу, назвавшуюся Любовью, про шабаш, который она растила из собственных дочерей, про князя демонов, которому в подвале приносили детей. Он записал. Попросил повторить и записал ещё раз.'
    :n>=6?'Старосте вы рассказали то, что поняли: в доме жила ведьма и крала детей. В этой истории не хватало кусков, и вы это знали.'
    :'Вы убили чудовище и вернули детей. Что это был за дом и почему он стал таким, вы так и не узнали. Иногда вам снятся рисунки мелом.');
  if(has('self'))P.push(`В деревне вы спросили, кто много лет назад вывез из приюта четырёхлетнего ребёнка по имени ${S.pc.name}. Вам назвали имя. Это уже другая дорога.`);
  P.push(pc>=3?'Говорят, в доме теперь тихо. Кто-то видел в окне кухни полную женщину: она мешала в котле и пела.':'В доме по-прежнему стучат ложки и хлопают в пустом зале. Туда не ходят.');

  if(f.fate=='temple')P.push('Жрецы приняли девочек и закрыли за ними дверь на три засова. Через год настоятель написал вам: младшая рисует на стенах кельи, старшая выучила все молитвы и читает их с выражением. Он писал, что боится старшей.');
  if(f.fate=='leave')P.push('Вы ушли и не оглянулись. Через десять лет в тех местах снова стали пропадать дети. Говорят, ведьм теперь две. Говорят, они ищут третью.');
  if(f.fate=='unseen')P.push('Когда вы уходили, вам показалось, что из окна третьего этажа смотрят вслед. Две пары глаз. Через десять лет в тех местах снова стали пропадать дети.');

     <textarea id="cx" readonly aria-label="Код сохранения">${enc(d)}</textarea><div class="mlist"><button data-a="copy">Скопировать код</button></div>`:'<p class="small">Сохранений пока нет: код появится после первого выхода на план дома.</p>'}
     <p class="small">Чтобы продолжить игру по коду, вставьте его сюда. Текущая игра будет заменена.</p>
     <textarea id="ci" placeholder="Вставьте код" aria-label="Вставить код сохранения"></textarea><div class="mlist"><button data-a="import">Загрузить из кода</button><button data-a="${back||'close'}">Назад</button></div>`}
  m.innerHTML=`<div class="col">${h}</div>`;
  m.oninput=e=>{if(e.target.id=='vm')AU.mv=+e.target.value;if(e.target.id=='vs')AU.sv=+e.target.value;setVol()};
  m.onchange=e=>{if(e.target.id=='vs')sfx('clue')};
  m.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(a=='close')closeMenu();else if(a=='main'){closeMenu();title()}
    else if(a=='copy'){const x=$('#cx');navigator.clipboard.writeText(x.value).then(()=>toast('Код скопирован'),()=>{x.focus();x.select();toast('Выделено: скопируйте вручную')})}
    else if(a=='import'){const d=dec($('#ci').value);if(!d)return toast('Код не подходит','bad');try{localStorage.setItem(slotKey(0),JSON.stringify(d))}catch(e){}S=d;B=null;Q=[];wait=null;clearInterval(typing);typing=null;$('#ov').innerHTML='';closeMenu();hud();toast('Игра загружена из кода');hub()}
    else if(a)menu(a);
    else if(b.dataset.s){toast(writeSlot(+b.dataset.s)?'Сохранено в ячейку '+b.dataset.s:'Не удалось сохранить','');menu('save')}
    else if(b.dataset.l!=null)loadGame(+b.dataset.l)};
}
function title(){
  S=null;B=null;Q=[];wait=null;clearInterval(typing);typing=null;atHub=false;const w=$('#whisper');w&&w.remove();
  $('#box').hidden=true;portrait(null);$('#mid').innerHTML='';hud();
  setBg('house');mood('title');$('#loc').textContent='';const auto=readSlot(0),any=[0,1,2,3].some(readSlot),ov=$('#ov');ov.hidden=false;ov.className='clear';
  ov.innerHTML=`<div class="col" id="mainmenu"><span class="eyebrow">хоррор-приключение на один вечер</span><h1>Приют слёз</h1>
   <p>В округе пропадают младенцы. Все следы ведут к заброшенному детскому приюту «Три добродетели».</p>
   <div class="mlist">${auto?`<button data-a="cont">Продолжить<small>${slotLine(auto)}</small></button>`:''}<button data-a="new">Новая игра</button>
   <button data-a="load" ${any?'':'disabled'}>Загрузить игру</button><button data-a="code">Код сохранения</button><button data-a="sound">Звук</button></div>
   <p class="small">Пробел или щелчок листают текст, цифры выбирают ответ, Esc открывает меню. В истории есть смерть детей и жестокость взрослых к ним: описаний крови почти нет, но тема тяжёлая.</p></div>`;
  ov.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(a=='cont'){ov.onclick=null;loadGame(0)}else if(a=='new'){ov.onclick=null;sfx('click');create()}else menu(a)};
}

/* ---------- character creation ---------- */
const COST=[0,1,2,3,4,5,7,9];let CR=null;
const recBuy=c=>{const pr=CLS[c].rec,v=[7,6,5,4,2,0],b={};pr.forEach((a,i)=>b[a]=v[i]);return{buy:b,plus:[pr[0],pr[1]]}};
const crSkills=()=>(CLS[CR.cls].sk=='any'?ALLSK:CLS[CR.cls].sk).filter(k=>!BGD[CR.bg][1].includes(k));
const crFix=()=>{const av=crSkills(),n=CLS[CR.cls].nsk;CR.sk=CR.sk.filter(k=>av.includes(k)).slice(0,n);for(const k of av){if(CR.sk.length>=n)break;if(!CR.sk.includes(k))CR.sk.push(k)}};
const crScore=a=>8+CR.buy[a]+(CR.plus.includes(a)?1:0);
const crPc=()=>{const ab={};Object.keys(AB).forEach(a=>ab[a]=crScore(a));const ex=['rogue','bard'].includes(CR.cls)?CR.sk.slice(0,2):[];
  return{name:CR.name.trim()||'Странник',cls:CR.cls,ab,sk:[...BGD[CR.bg][1],...CR.sk],ex,bg:CR.bg}};
function create(){CR={step:0,name:'',cls:'fighter',...recBuy('fighter'),bg:'urchin',sk:[]};crFix();crDraw()}
function crDraw(){
  const ov=$('#ov'),c=CLS[CR.cls],spent=Object.values(CR.buy).reduce((s,v)=>s+COST[v],0),left=27-spent;let h='',ok=true,why='';
  if(CR.step==0)h=`<label for="nm">Имя</label><input type="text" id="nm" maxlength="18" placeholder="Странник" value="${CR.name.replace(/"/g,'')}">
   <label>Класс</label><div class="grid">${Object.keys(CLS).map(k=>`<button class="chip" data-c="${k}" aria-pressed="${k==CR.cls}">${CLS[k].n}</button>`).join('')}</div>
   <div class="info"><b>${c.n} · ${c.sub}</b><span>Кость хитов d${c.hd}. Спасброски: ${c.saves.map(a=>AB[a]).join(', ')}. Главная характеристика: ${c.prim.map(a=>AB[a]).join(' или ')}.</span>
   <span><b>${c.trait[0]}.</b> ${c.trait[1]}</span><span>Снаряжение: ${c.gear}.</span>
   <span>Колода: ${[...new Set(c.deck)].map(k=>k=='strike'?c.sn:k=='defend'?c.dn:CARDS[k].n).join(', ')}.</span></div>
   <p class="small">Раса: человек. Уровень: третий. Заклинания, на которые в настольной игре тратится ячейка, здесь сгорают до конца боя.</p>`;
  if(CR.step==1){ok=CR.plus.length==2;why='Выберите две характеристики для человеческого +1';
   h=`<div class="info"><span>Очков осталось: <b>${left}</b> из 27. Все характеристики начинают с 8, поднять можно не выше 15.</span><span>Человек: +1 к двум разным характеристикам (выбрано ${CR.plus.length} из 2).</span></div>
   <div class="abt"><span class="h">характеристика</span><span class="h"></span><span class="h">покупка</span><span class="h"></span><span class="h">+1</span><span class="h cst">цена</span><span class="h">итог</span>
   ${Object.keys(AB).map(a=>{const v=CR.buy[a],up=v<7&&COST[v+1]-COST[v]<=left,sc=crScore(a);
    return `<b>${AB[a]}${c.prim.includes(a)?' ★':''}</b><button data-m="${a}" ${v>0?'':'disabled'} aria-label="Уменьшить ${AB[a]}">−</button><span class="sc" style="color:var(--bone)">${8+v}</span><button data-p="${a}" ${up?'':'disabled'} aria-label="Увеличить ${AB[a]}">+</button>
     <button data-h="${a}" aria-pressed="${CR.plus.includes(a)}" ${CR.plus.includes(a)||CR.plus.length<2?'':'disabled'} aria-label="Человеческий бонус к ${AB[a]}">+1</button><span class="small cst">${COST[v]} очк.</span><span class="sc">${sc} <small style="font-size:15px;color:var(--ash)">${(sc>=10?'+':'')+Math.floor((sc-10)/2)}</small></span>`}).join('')}</div>
   <div class="nav"><button class="btn2" data-a="rec">Расставить за меня</button><button class="btn2" data-a="zero">Сбросить</button></div>
   <p class="small">★ главная характеристика класса: она прибавляется к урону ваших карт. Ловкость (у варвара Телосложение) прибавляется к защите, у тяжёлых доспехов защита фиксированная. Телосложение даёт здоровье.</p>`}
  if(CR.step==2){const av=crSkills(),n=c.nsk;ok=CR.sk.length==n;why=`Выберите навыков: ${n}`;
   h=`<label>Предыстория</label><div class="grid">${Object.keys(BGD).map(k=>`<button class="chip" data-b="${k}" aria-pressed="${k==CR.bg}">${BGD[k][0]}</button>`).join('')}</div>
   <div class="info"><span>${BGD[CR.bg][2]}</span><span>Даёт навыки: ${BGD[CR.bg][1].map(k=>SK[k][0]).join(', ')}.</span></div>
   <label>Навыки класса: выбрано ${CR.sk.length} из ${n}</label><div class="grid">${ALLSK.map(k=>{const bg=BGD[CR.bg][1].includes(k),on=CR.sk.includes(k);
     return `<button class="chip ${bg?'fix':''}" data-k="${k}" aria-pressed="${on}" ${bg||!av.includes(k)||(!on&&CR.sk.length>=n)?'disabled':''}>${SK[k][0]}${bg?' ✓':''}<br><small>${AB[SK[k][1]]}</small></button>`}).join('')}</div>
   <p class="small">Владение даёт +2 к проверке навыка. В доме чаще всего пригодятся Внимательность, Проницательность, Расследование, Медицина, Религия и История.${['rogue','bard'].includes(CR.cls)?' Компетентность (+4) получат два первых выбранных навыка: '+CR.sk.slice(0,2).map(k=>SK[k][0]).join(', ')+'.':''}</p>`}
  if(CR.step==3){const pc=crPc(),f=fresh(pc);h=`<div class="sheet">${sheetHtml(pc,f.max)}</div><p class="small">Здоровье: d${c.hd} на первом уровне и по ${c.hd/2+1} на втором и третьем, плюс модификатор Телосложения за каждый уровень${c.hpb?', плюс драконья стойкость':''}.</p>`}
  ov.hidden=false;ov.className='';
  ov.innerHTML=`<div class="col" id="cr"><span class="eyebrow">создание персонажа</span><h2>${['Кто вы','Характеристики','Навыки и прошлое','Лист персонажа'][CR.step]}</h2>
   <div class="steps">${['Имя и класс','Характеристики','Навыки','Итог'].map((t,i)=>`<span class="${i==CR.step?'on':''}">${i+1}. ${t}</span>`).join('')}</div>${h}
   <div class="nav"><button class="btn2" data-a="back">${CR.step?'Назад':'В главное меню'}</button><span class="small" style="align-self:center">${ok?'':why}</span><button class="btn2" data-a="next" ${ok?'':'disabled'}>${CR.step==3?'Войти в дом':'Дальше'}</button></div></div>`;
  const nm=$('#nm');if(nm)nm.oninput=()=>CR.name=nm.value;
  ov.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;sfx('click');
    if(d.c){CR.cls=d.c;Object.assign(CR,recBuy(d.c));crFix()}
    else if(d.p)CR.buy[d.p]++;else if(d.m)CR.buy[d.m]--;
    else if(d.h)CR.plus=CR.plus.includes(d.h)?CR.plus.filter(x=>x!=d.h):[...CR.plus,d.h];
    else if(d.b){CR.bg=d.b;crFix()}
    else if(d.k)CR.sk=CR.sk.includes(d.k)?CR.sk.filter(x=>x!=d.k):[...CR.sk,d.k];
    else if(d.a=='rec')Object.assign(CR,recBuy(CR.cls));
    else if(d.a=='zero'){Object.keys(CR.buy).forEach(a=>CR.buy[a]=0);CR.plus=[]}
    else if(d.a=='back'){if(!CR.step){ov.onclick=null;return title()}CR.step--}
    else if(d.a=='next'){if(CR.step==3){ov.onclick=null;ov.hidden=true;ov.innerHTML='';S=fresh(crPc());hud();return run(SC.intro())}CR.step++}
    crDraw()};
}

/* ---------- dust ---------- */
(function dust(){
  if(calm)return;const c=$('#fx'),x=c.getContext('2d');let P=[];
  const rs=()=>{c.width=c.clientWidth;c.height=c.clientHeight;P=Array.from({length:46},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:.6+Math.random()*1.6,v:.1+Math.random()*.3,p:Math.random()*6}))};
  addEventListener('resize',rs);rs();
  (function f(t){x.clearRect(0,0,c.width,c.height);for(const p of P){p.y-=p.v;p.x+=Math.sin(t/1700+p.p)*.25;if(p.y<-4){p.y=c.height+4;p.x=Math.random()*c.width}
    x.globalAlpha=.18+.18*Math.sin(t/900+p.p);x.fillStyle='#e9e2d0';x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()}requestAnimationFrame(f)})(0);
})();
title();
</script>
